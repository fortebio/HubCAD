# HubCAD — Drawing Tool
#   docker compose up -d --build
# Then expose inside the tailnet (once, persists across reboots):
#   tailscale serve --bg --https=8443 http://127.0.0.1:3001
services:
  hubcad:
    build: .
    container_name: hubcad
    restart: unless-stopped
    # Bind to loopback only — Tailscale Serve is the sole public entry point.
    ports:
      - "127.0.0.1:3001:3001"
    env_file: .env
    environment:
      API_PORT: 3001
      DATABASE_URL: /app/data/drawing-tool.db
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
